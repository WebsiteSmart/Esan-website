<aside aria-label="Quick contact" class="fixed bottom-6 right-6 z-40">
  <a
    [href]="business().whatsappUrl"
    target="_blank"
    rel="noopener noreferrer"
    class="group relative flex items-center justify-center w-14 h-14 bg-[#25D366] hover:bg-[#20ba5a] text-white rounded-full shadow-2xl transition-all duration-300 hover:scale-110 focus:outline-none focus-visible:ring-4 focus-visible:ring-green-400 focus-visible:ring-offset-2"
    aria-label="Chat with ESAN MEN'S WEAR on WhatsApp"
  >
    <!-- Subtle pulse ring -->
    <span class="absolute -inset-1 rounded-full bg-[#25D366]/40 animate-ping opacity-75 pointer-events-none"></span>

    <!-- WhatsApp SVG icon -->
    <svg class="w-7 h-7 fill-current relative z-10" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2zm0 18.08c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.12 8.12 0 01-1.25-4.32c0-4.52 3.68-8.2 8.2-8.2 2.19 0 4.25.85 5.8 2.4 1.55 1.55 2.4 3.61 2.4 5.8 0 4.52-3.68 8.18-8.16 8.18z"/>
    </svg>

    <!-- Tooltip -->
    <span class="absolute right-16 top-1/2 -translate-y-1/2 whitespace-nowrap bg-esan-navy text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow-lg opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity duration-200 hidden sm:block">
      Chat on WhatsApp
    </span>
  </a>
</aside>
